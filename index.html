<!DOCTYPE html>
<html lang="id">
<head>
  <!--
    Placeholder base href — diganti oleh `flutter build web --base-href ...`.
    JANGAN hard-code path di sini.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="CoalTrack — aplikasi absensi & HR PT Surya Alam Bakti (demo web).">
  <meta name="theme-color" content="#0B1220">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CoalTrack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CoalTrack — PT Surya Alam Bakti</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Dark-first: latar navy dalam agar first paint tidak berkedip putih. */
    html, body { height: 100%; margin: 0; background: #0B1220; }
    /* Loader ringan selama main.dart.js diunduh (terasa di jaringan HP). */
    #ct-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #0B1220; color: #F5A524;
      font: 700 15px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: .3px;
    }
    #ct-loading .ring {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(245, 165, 36, .22); border-top-color: #F5A524;
      animation: ct-spin .9s linear infinite;
    }
    @keyframes ct-spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: light) {
      /* Tetap gelap saat memuat — merek CoalTrack dark-first. */
      html, body, #ct-loading { background: #0B1220; }
      #ct-loading { color: #F5A524; }
    }
  </style>
</head>
<body>
  <div id="ct-loading" aria-live="polite">
    <div class="ring"></div>
    <div>CoalTrack</div>
  </div>
  <script>
    // Flutter mengirim event ini setelah frame pertama dirender.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('ct-loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
